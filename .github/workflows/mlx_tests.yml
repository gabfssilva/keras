name: MLX Metal Tests (macOS)

# Metal / Apple Silicon coverage for the MLX backend. CPU coverage already runs
# in actions.yml alongside the other backends; this job covers the Metal GPU.
# Disabled by default (manual dispatch only) — to enable on CI, add the usual
# push/pull_request triggers below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Run tests (3.11, mlx, metal)
    runs-on: macos-14
    env:
      PYTHON: '3.11'
      KERAS_HOME: .github/workflows/config/mlx
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip setuptools
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: pip cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements-mlx-metal.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements-mlx-metal.txt --progress-bar off --upgrade
          pip uninstall -y keras keras-nightly
          pip install -e "." --progress-bar off --upgrade

      - name: Verify Metal device
        run: python -c "import mlx.core as mx; print('MLX device:', mx.default_device()); assert mx.metal.is_available()"

      - name: Test integrations
        run: |
          python integration_tests/import_test.py

      - name: Test with pytest
        run: |
          pytest keras --ignore keras/src/applications --cov=keras --cov-config=pyproject.toml
          coverage xml --omit='keras/src/applications/*,keras/api' -o core-coverage.xml

      - name: Codecov keras
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v5
        with:
          env_vars: PYTHON,KERAS_HOME
          flags: keras,keras-mlx,keras-metal
          files: core-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
